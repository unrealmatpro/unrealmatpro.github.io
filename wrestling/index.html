  // LINKS FIJOS

    { "nombre": "VKVideo (ES)", "url": "https://live.vkvideo.ru/app/embed/noobcraftero" },
    { "nombre": "RingMotif (ES)", "url": "https://ringmotif.net/e/jmekma4q2tzcn" },

    { "nombre": "HLS Stream (ES)", "url": "https://81j8b6.a737cozfwjmm.net:8443/hls/7i3bhp9zq8spc.m3u8?s=597qVniU09e_UstrppKsww&e=1794638911" }

  const corePlayers = { a: { plyr:null, hls:null, fallbackTimer:null, networkRetries:0, streamTriggered:false, currentTitle:null, currentBrand:null, currentUrl:null }, b: { plyr:null, hls:null, fallbackTimer:null, networkRetries:0, streamTriggered:false, currentTitle:null, currentBrand:null, currentUrl:null } };

  function detectShow(txt){ const u = String(txt || '').toUpperCase(); if (/\bRAW\b/.test(u)) return 'card-raw'; if (/\bSMACKDOWN\b/.test(u)) return 'card-sd'; if (/\bNXT\b/.test(u)) return 'card-nxt'; if (/\bDYNAMITE\b/.test(u)) return 'card-dyn'; if (/\bCOLLISION\b/.test(u)) return 'card-col'; if (/\bTNA\b/.test(u)) return 'card-tna'; if (/\bNJPW\b/.test(u)) return 'card-njpw'; return ''; }
  function normalizar(texto) { return (texto || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase(); }
  
  function bootstrapPlyr(slot){ if (typeof Plyr === 'undefined') return; const el = document.getElementById(`vid-${slot}`); if (!el || corePlayers[slot].plyr) return; corePlayers[slot].plyr = new Plyr(el, { controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'] }); }

  function updateMasterTimer(date, title){
    clearTimeout(timerTimeout);
    const statusEl = document.getElementById('timer-status'); const timerEl  = document.getElementById('timer');
    if (!statusEl || !timerEl) return;
    statusEl.innerText = `SIGUIENTE: ${String(title || '').toUpperCase()}`;
    const target = new Date(date).getTime();
    function schedule(ms){ clearTimeout(timerTimeout); timerTimeout = setTimeout(() => { if (document.hidden) { schedule(30000); return; } tick(); }, ms); }
    function tick(){
      const diff = target - Date.now();
      if (diff <= 0){ timerEl.style.color = "var(--live-red)"; timerEl.innerText = "LIVE NOW"; schedule(60000); return; }
      const hoursTotal = diff / 36e5;
      if (hoursTotal >= 1){ const d = Math.floor(diff / 864e5), h = Math.floor((diff % 864e5) / 36e5), m = Math.floor((diff % 36e5) / 6e4); timerEl.innerText = `${d}D ${h}H ${m}M`; schedule(60000); }
      else { const h = Math.floor(diff / 36e5), m = Math.floor((diff % 36e5) / 6e4), s = Math.floor((diff % 6e4) / 1e3); timerEl.innerText = `${h}H ${m}M ${s}S`; schedule(1000); }
    }
    tick();
  }

  function showLoader(slot){ const el = document.getElementById(`loader-${slot}`); if (el){ el.classList.add('active'); } }
  function hideLoader(slot){ const el = document.getElementById(`loader-${slot}`); if (el){ el.classList.remove('active'); } }
  function showError(slot){ hideLoader(slot); const el = document.getElementById(`error-${slot}`); if (el){ el.classList.add('active'); } }
  function hideError(slot){ const el = document.getElementById(`error-${slot}`); if (el){ el.classList.remove('active'); } }

  function destroyMediaPipeline(slot){
    const cp = corePlayers[slot]; clearTimeout(cp.fallbackTimer); cp.streamTriggered = false; cp.networkRetries = 0;
    if (cp.hls){ try { cp.hls.detachMedia(); cp.hls.destroy(); } catch(_) {} cp.hls = null; }
    const video = document.getElementById(`vid-${slot}`);
    if (video){ try { video.pause(); video.removeAttribute('src'); video.load(); } catch(_) {} const container = video.closest('.plyr'); if (container) container.classList.remove('active'); }
    const embedContainer = document.getElementById(`embed-container-${slot}`); if (embedContainer){ embedContainer.innerHTML = ''; embedContainer.classList.remove('active'); }
    const ghost = document.getElementById(`ghost-${slot}`); if (ghost) ghost.style.display = 'block';
    const pulse = document.getElementById(`pulse-${slot}`); if (pulse) pulse.style.display = 'none';
    const lbl = document.getElementById(`label-${slot}`)?.querySelector('.label-text-slot'); if (lbl) lbl.innerText = `CANAL ${slot.toUpperCase()}`;
    hideLoader(slot); hideError(slot);
  }

  function triggerFallback(slot, streamConfig){
    const cp = corePlayers[slot]; clearTimeout(cp.fallbackTimer);
    const video = document.getElementById(`vid-${slot}`); const embedContainer = document.getElementById(`embed-container-${slot}`);
    if (!embedContainer) return;
    if (video){ try { video.pause(); video.removeAttribute('src'); video.load(); } catch(_) {} const container = video.closest('.plyr'); if (container) container.classList.remove('active'); }
    if (cp.hls){ try { cp.hls.detachMedia(); cp.hls.destroy(); } catch(_) {} cp.hls = null; }
    const backupUrl = streamConfig && streamConfig.backup; if (!backupUrl || backupUrl === "..." ){ showError(slot); return; }
    embedContainer.classList.add('active'); embedContainer.innerHTML = '';
    const iframe = document.createElement('iframe'); iframe.src = backupUrl; iframe.setAttribute('allow', 'autoplay; fullscreen; encrypted-media'); iframe.setAttribute('allowfullscreen', 'true'); iframe.setAttribute('scrolling', 'no');
    iframe.addEventListener('load', () => { cp.streamTriggered = true; hideLoader(slot); hideError(slot); }, { once: true });
    embedContainer.appendChild(iframe); setTimeout(() => { if (!cp.streamTriggered) showError(slot); }, 10000);
  }

  function hookStream(slot, title, brand, customUrl){
    if (!title) title = 'Señal'; if (!brand) brand = 'DEFAULT';
    destroyMediaPipeline(slot);
    const cp = corePlayers[slot]; cp.currentTitle = title; cp.currentBrand = brand; cp.currentUrl = customUrl || null;
    hideError(slot); showLoader(slot);
    const video = document.getElementById(`vid-${slot}`); const ghost = document.getElementById(`ghost-${slot}`);
    const labelText = document.getElementById(`label-${slot}`).querySelector('.label-text-slot'); const pulse = document.getElementById(`pulse-${slot}`);
    if (ghost) ghost.style.display = 'none'; if (pulse) pulse.style.display = 'inline-block'; if (labelText) labelText.innerText = `${slot.toUpperCase()}: ${title.toUpperCase()}`;
    if (slot === 'b'){ if (cp.plyr) cp.plyr.muted = true; if (labelText) labelText.innerText += " (MUTED)"; }
    
    let streamConfig; if (customUrl){ streamConfig = { primary: customUrl, backup: STREAMS.DEFAULT.backup }; } else { streamConfig = getStreamConfig(brand); }
    
    // Para URLs de Embed/Iframe, NO usamos Plyr (evitamos el botón verde gigante)
    if (typeof streamConfig.primary === 'string' && (streamConfig.primary.includes('/embed/') || streamConfig.primary.includes('.php') || streamConfig.primary.includes('catchup'))) {
        const embedContainer = document.getElementById(`embed-container-${slot}`);
        embedContainer.classList.add('active'); embedContainer.innerHTML = '';
        const iframe = document.createElement('iframe'); iframe.src = streamConfig.primary; iframe.setAttribute('allowfullscreen', 'true'); iframe.setAttribute('scrolling', 'no'); iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
        embedContainer.appendChild(iframe); hideLoader(slot); return;
    }

    // Para m3u8, usamos Plyr
    const plyrContainer = video.closest('.plyr'); if (plyrContainer) plyrContainer.classList.add('active');
    cp.fallbackTimer = setTimeout(() => { if (!cp.streamTriggered){ triggerFallback(slot, streamConfig); } }, 5000);
    if (typeof Hls !== 'undefined' && Hls.isSupported()){
      const hls = new Hls({ enableWorker: true }); cp.hls = hls;
      hls.loadSource(streamConfig.primary); hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { cp.streamTriggered = true; clearTimeout(cp.fallbackTimer); hideLoader(slot); video.play().catch(()=>{}); });
      hls.on(Hls.Events.ERROR, (_, data) => { if (data.fatal) triggerFallback(slot, streamConfig); });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) { video.src = streamConfig.primary; video.play().catch(() => triggerFallback(slot, streamConfig)); }
    else { triggerFallback(slot, streamConfig); }
  }

  // LÓGICA DE PANTALLA AUTOMÁTICA
  function playAutomatic(url, title, brand) {
      if (!corePlayers.a.currentUrl) {
          hookStream('a', title, brand, url);
      } else if (!corePlayers.b.currentUrl) {
          activateSplit();
          hookStream('b', title, brand, url);
      } else {
          hookStream('a', title, brand, url);
      }
  }

  function reconnectSlot(slot){ const cp = corePlayers[slot]; if (cp.currentTitle) hookStream(slot, cp.currentTitle, cp.currentBrand, cp.currentUrl); }

  async function refreshArena(filter){
    currentBrandFilter = filter;
    if (currentFeedMode === '247'){ render247Grid(filter); return; }

    const ticker = document.getElementById('main-ticker'); ticker.innerHTML = '';
    const loading = document.createElement('div'); loading.style.cssText = 'padding:20px; font-family:Oswald; color: var(--accent);'; loading.textContent = 'SINTONIZANDO EMISIONES...'; ticker.appendChild(loading);

    try {
        const res = await fetch(`../output/agenda_wrestling.json?v=${Date.now()}`);
        if (res.ok) { const data = await res.json(); jsonEvents = data.eventos || []; }
    } catch(e) { console.log("Error JSON Wrest:", e); }

    if (currentFeedMode === 'REPLAY') {
        let replays = jsonEvents.filter(e => e.servidores_replay && e.servidores_replay.length > 0);
        if (filter !== 'OMNI') replays = replays.filter(e => e.torneo === filter);
        
        if (replays.length === 0) {
            ticker.innerHTML = '<div style="padding:20px; color:#555; font-family:Oswald;">NO HAY REPETICIONES DISPONIBLES</div>';
            document.getElementById('timer-status').innerText = 'REPLAYS'; document.getElementById('timer').innerText = '--D --H --M';
            return;
        }
        document.getElementById('timer-status').innerText = 'SECCION DE REPETICIONES'; document.getElementById('timer').innerText = '∞ REPLAY';
        ticker.innerHTML = '';
        replays.forEach(ev => { ticker.appendChild(buildReplayCard(ev)); });
        return;
    }

    const fetchId = ++activeFetchId; if (currentFetchController) currentFetchController.abort();
    currentFetchController = new AbortController(); const signal = currentFetchController.signal;
    const isCurrent = () => fetchId === activeFetchId;
    
    const timeMin = new Date(Date.now() - 6 * 60 * 60 * 1000).toISOString(); 
    const targets = filter === "OMNI" ? Object.keys(BRANDS) : [filter];
    
    const promises = targets.map(async (brand) => {
      try {
        const calendarId = encodeURIComponent(BRANDS[brand].calendarId);
        const url = `https://www.googleapis.com/calendar/v3/calendars/${calendarId}/events?key=${encodeURIComponent(API_KEY)}&timeMin=${timeMin}&maxResults=10&singleEvents=true&orderBy=startTime`;
        const response = await fetch(url, { method: "GET", signal }); if (!response.ok) throw new Error(`HTTP`);
        const resData = await response.json(); if (!resData.items) return [];
        
        return resData.items.map(item => {
          const rawStart = item.start.dateTime || item.start.date; const rawEnd = item.end?.dateTime || item.end?.date || null;
          return { summary: item.summary || 'Evento', brandName: brand, start: new Date(rawStart).getTime() + 3600000, end: rawEnd ? new Date(rawEnd).getTime() + 3600000 : null };
        });
      } catch(err){ if (err.name === 'AbortError') throw err; return []; }
    });
    
    try {
      const results = await Promise.allSettled(promises); if (!isCurrent()) return;
      const wasAborted = results.some(r => r.status === 'rejected' && r.reason?.name === 'AbortError'); if (wasAborted) return;
      
      const masterList = results.filter(r => r.status === 'fulfilled').flatMap(r => r.value);
      renderDashboard(masterList, filter);
      
    } catch(err){ 
        if (!isCurrent()) return; 
        renderDashboard([], filter); 
    }
  }

  function renderDashboard(calendarList, filter){
    const ticker = document.getElementById('main-ticker');
    const now = Date.now();
    
    let finalList = (calendarList || []).filter(ev => {
        const diffHours = (now - ev.start) / (1000 * 60 * 60);
        return diffHours < 2.5; 
    });
    
    finalList.forEach(ev => {
        const match = jsonEvents.find(je => {
            const n1 = normalizar(ev.summary); const n2 = normalizar(je.titulo);
            return n1.includes(n2) || n2.includes(n1);
        });

        let allLinks = [];
        if (match) {
            // Los links de 1max ya vienen con formato "CatchUp 85 SD" etc.
            allLinks = [...match.servidores_live];
        }
        
        // AGREGAMOS LOS LINKS FIJOS
        let fixedEnLinks = [...ENGLISH_LINKS];
        let fixedEsLinks = [...SPANISH_LINKS];

        // FILTRO PROFESIONAL: Tomar 2 de cada uno
        // Priorizar los links scrapeados de 1max para inglés si existen, sino usar los fijos
        let finalEn = allLinks.filter(l => !l.nombre.includes('(ES)')).slice(0, 2);
        if (finalEn.length < 2) finalEn = [...finalEn, ...fixedEnLinks.slice(0, 2 - finalEn.length)];

        let finalEs = allLinks.filter(l => l.nombre.includes('(ES)')).slice(0, 2);
        if (finalEs.length < 2) finalEs = [...finalEs, ...fixedEsLinks.slice(0, 2 - finalEs.length)];

        ev.servidores = [...finalEs, ...finalEn];
    });

    if (finalList.length === 0) { 
        ticker.innerHTML = '<div style="padding:20px; font-family:Oswald; color:#555;">NO HAY EMISIONES EN VIVO O PRÓXIMAS</div>'; 
        document.getElementById('timer-status').innerText = 'SIN EVENTOS PENDIENTES'; document.getElementById('timer').innerText = '--D --H --M'; return; 
    }

    const accent = filter === "OMNI" ? "#00ff88" : (BRANDS[filter]?.color ?? "#e21017"); document.documentElement.style.setProperty('--accent', accent);
    
    const uniqueShows = new Map();
    finalList.forEach(ev => {
        const showName = String(ev.summary).toUpperCase().trim();
        if (!uniqueShows.has(showName) || ev.start < uniqueShows.get(showName).start) { 
            uniqueShows.set(showName, ev); 
        }
    });
    
    let list = Array.from(uniqueShows.values());
    list.sort((a, b) => a.start - b.start);
    
    updateMasterTimer(list[0].start, list[0].summary); ticker.innerHTML = '';
    
    list.forEach(ev => {
      const isLiveNow = now >= ev.start && now < (ev.end || ev.start + 14400000); 
      ticker.appendChild(buildLiveCard(ev, isLiveNow));
    });
  }

  function buildLiveCard(ev, isLiveNow){
    const card = document.createElement('div'); card.className = `match-card ${detectShow(ev.summary)}${isLiveNow ? ' is-live' : ''}`;
    const info = document.createElement('div'); info.className = 'match-info'; const brandSpan = document.createElement('span'); brandSpan.textContent = ev.brandName || '';
    const liveSpan = document.createElement('span'); liveSpan.className = 'live-indicator-text'; liveSpan.textContent = '• EN VIVO'; const timeSpan = document.createElement('span');
    try { timeSpan.textContent = new Date(ev.start).toLocaleString('es-UY', { weekday: 'short', hour: '2-digit', minute: '2-digit' }) + ' HS'; } catch(_) {}
    info.appendChild(brandSpan); info.appendChild(liveSpan); info.appendChild(timeSpan); const title = document.createElement('div'); title.className = 'match-title'; title.textContent = ev.summary || 'Evento';
    
    const actions = document.createElement('div'); actions.className = 'action-row';
    
    if (ev.servidores && ev.servidores.length > 0) {
        ev.servidores.forEach(srv => {
            const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn-assign'; btn.textContent = srv.nombre;
            btn.addEventListener('click', () => playAutomatic(srv.url, `${ev.summary} - ${srv.nombre}`, ev.brandName)); 
            actions.appendChild(btn);
        });
    }
    
    card.appendChild(info); card.appendChild(title); card.appendChild(actions); return card;
  }

  function buildReplayCard(ev){
    const card = document.createElement('div'); card.className = `match-card ${detectShow(ev.titulo)}`;
    const info = document.createElement('div'); info.className = 'match-info'; const brandSpan = document.createElement('span'); brandSpan.textContent = ev.torneo || '';
    const liveSpan = document.createElement('span'); liveSpan.className = 'live-indicator-text'; liveSpan.textContent = '• REPLAY'; const timeSpan = document.createElement('span'); timeSpan.textContent = 'VOD';
    info.appendChild(brandSpan); info.appendChild(liveSpan); info.appendChild(timeSpan); const title = document.createElement('div'); title.className = 'match-title'; title.textContent = ev.titulo || 'Repetición';
    
    const actions = document.createElement('div'); actions.className = 'action-row';
    ev.servidores_replay.slice(0, 4).forEach(srv => { 
        const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn-assign'; btn.textContent = srv.nombre.substring(0, 20);
        btn.addEventListener('click', () => playAutomatic(srv.url, `${ev.titulo} - ${srv.nombre}`, ev.torneo)); 
        actions.appendChild(btn);
    });
    card.appendChild(info); card.appendChild(title); card.appendChild(actions); return card;
  }

  function render247Grid(filter){ ticker.innerHTML = '<div style="padding:20px; color:#555; font-family:Oswald;">SIN CANALES 24/7</div>'; }

  document.querySelectorAll('.brand-item').forEach(item => {
    item.addEventListener('click', () => { document.querySelectorAll('.brand-item').forEach(i => i.classList.remove('active')); item.classList.add('active'); refreshArena(item.dataset.brand); });
  });

  document.querySelectorAll('.feed-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const mode = tab.dataset.feed; if (mode === currentFeedMode) return; currentFeedMode = mode;
      document.querySelectorAll('.feed-tab').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); }); tab.classList.add('active'); tab.setAttribute('aria-selected', 'true');
      refreshArena(currentBrandFilter);
    });
  });

  const webIdentity = document.getElementById('web-identity');
  if (webIdentity){ webIdentity.addEventListener('click', () => window.location.reload()); }

  document.querySelectorAll('.slot-error .btn-assign').forEach(btn => { btn.addEventListener('click', () => reconnectSlot(btn.dataset.slot)); });
  document.getElementById('btn-split')?.addEventListener('click', toggleOmniSplit);
  document.getElementById('btn-theatre')?.addEventListener('click', toggleTheatreMode);

  window.addEventListener('load', () => { bootstrapPlyr('a'); refreshArena('OMNI'); });
  window.addEventListener('beforeunload', () => { clearTimeout(timerTimeout); if (currentFetchController) { try { currentFetchController.abort(); } catch(_) {} } destroyMediaPipeline('a'); destroyMediaPipeline('b'); });

})();
</script>
