<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset='UTF-8'/>
  <meta content='width=device-width, initial-scale=1.0' name='viewport'/>
  <title>Wrestling Hub | UNREALMAT PRO+</title>
  <link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' rel='stylesheet'/>
  <link href='https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap' rel='stylesheet'/>

  <style>
    :root { --wr-red:#e11d48; --wr-gold:#fbbf24; --wr-dark:#07070b; --wr-panel:#111118; --wr-card:#181822; --text-main:#f8fafc; --text-soft:#94a3b8; --toast-accent:#fbbf24; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: radial-gradient(circle at top, #1b0b14 0%, var(--wr-dark) 65%); color: var(--text-main); font-family: 'Outfit', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
    .stadium-app { width: 100%; height: 100vh; display: flex; flex-direction: column; }
    header { height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: rgba(7, 7, 11, 0.92); border-bottom: 2px solid var(--wr-red); box-shadow: 0 4px 20px rgba(0,0,0,0.65); z-index: 100; flex-shrink: 0; gap: 12px; }
    .brand-box { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .brand-box h1 { font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 32px; letter-spacing: 1px; text-transform: uppercase; color: #fff; }
    .brand-box h1 span { color: var(--wr-gold); }
    .btn-return, .btn-refresh { font-size: 11px; font-weight: 800; color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,0.2); padding: 7px 14px; border-radius: 6px; transition: 0.2s; background: rgba(255,255,255,0.05); cursor: pointer; display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn-return:hover, .btn-refresh:hover { background: var(--wr-red); border-color: var(--wr-red); color: #fff; }
    .btn-refresh i { transition: transform 0.5s ease; }
    .btn-refresh.spinning i { transform: rotate(360deg); }
    .stadium-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .grid-btn { height: 36px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.1); background: #14141f; color: #cbd5e1; font-size: 11px; font-weight: 700; cursor: pointer; border-radius: 6px; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
    .grid-btn:hover { border-color: var(--wr-gold); color: #fff; }
    .active-grid { background: var(--wr-red); color: #fff; border-color: var(--wr-gold); }
    .cinema-btn { background: rgba(251,191,36,0.14); color: var(--wr-gold); border: 1px solid rgba(251,191,36,0.45); }
    .cinema-btn:hover { background: var(--wr-gold); color: #000; }
    .stadium-main { flex: 1; display: grid; grid-template-columns: 1fr 440px; overflow: hidden; height: calc(100vh - 70px); }
    .stadium-player-zone { display: flex; flex-direction: column; background: #000; height: 100%; width: 100%; min-height: 0; }
    .video-wrapper { width: 100%; flex: 1; min-height: 0; position: relative; }
    #stadium-grid-mesh { width: 100%; height: 100%; display: grid; gap: 8px; }
    .stadium-monitor { background: #000; overflow: hidden; position: relative; border: 2px solid rgba(255,255,255,0.03); display: flex; align-items: center; justify-content: center; }
    .stadium-monitor.focus-pitch { border-color: var(--wr-gold); box-shadow: inset 0 0 20px rgba(251,191,36,0.14); }
    .monitor-tag { position: absolute; top: 10px; left: 10px; background: rgba(7,7,11,0.88); padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: 700; color: #fff; border-left: 3px solid var(--wr-red); z-index: 10; cursor: pointer; }
    .stadium-core { width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #64748b; }
    .mute-badge { position: absolute; top: 40px; right: 8px; background: rgba(225,29,72,0.92); color: #fff; padding: 5px 10px; border-radius: 4px; font-size: 10px; font-weight: 700; z-index: 50; display: none; align-items: center; gap: 5px; cursor: pointer; border: 1px solid rgba(255,255,255,0.3); }
    .mute-badge.visible { display: flex; }
    #alternative-servers-panel { display: none; padding: 12px 16px; background: #0d0d14; border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; max-height: 125px; overflow-y: auto; }
    .alt-servers-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .alt-servers-title { color: var(--wr-gold); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
    .mode-pill { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
    .mode-pill.live { background: rgba(225,29,72,0.2); color: #fb7185; border: 1px solid var(--wr-red); }
    .mode-pill.replay { background: rgba(251,191,36,0.16); color: var(--wr-gold); border: 1px solid rgba(251,191,36,0.45); }
    .alt-servers-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .alt-btn { background: rgba(255,255,255,0.05); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.12); padding: 6px 14px; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: 700; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
    .alt-btn:hover { background: var(--wr-red); border-color: var(--wr-gold); color: #fff; }
    .alt-btn.replay-btn:hover { background: var(--wr-gold); border-color: var(--wr-gold); color: #000; }
    .stadium-sidebar { background: var(--wr-panel); border-left: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .hero-match { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); background: linear-gradient(135deg, rgba(225,29,72,0.28) 0%, rgba(7,7,11,0.95) 100%); border-left: 4px solid var(--wr-gold); flex-shrink: 0; }
    .hero-label { color: var(--wr-gold); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; font-family: 'JetBrains Mono', monospace; }
    .hero-title { font-family: 'Big Shoulders Display', sans-serif; font-size: 24px; font-weight: 900; letter-spacing: 0.5px; color: #fff; text-transform: uppercase; }
    .company-tabs { display: flex; background: #09090e; border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; overflow-x: auto; }
    .company-tab { flex: 1; min-width: 66px; padding: 11px 6px; background: transparent; border: none; color: var(--text-soft); font-weight: 800; font-size: 10px; text-transform: uppercase; cursor: pointer; border-bottom: 2px solid transparent; transition: 0.2s; font-family: 'JetBrains Mono', monospace; }
    .company-tab.active { color: var(--wr-gold); border-bottom-color: var(--wr-gold); background: rgba(251,191,36,0.08); }
    .mode-subbar { display: flex; gap: 6px; padding: 8px 12px; background: #0d0d14; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
    .mode-filter-btn { flex: 1; padding: 6px 8px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.1); background: #151520; color: #cbd5e1; font-size: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }
    .mode-filter-btn.active { background: var(--wr-red); border-color: var(--wr-gold); color: #fff; }
    .search-container { padding: 10px 12px; background: rgba(7,7,11,0.5); border-bottom: 1px solid rgba(255,255,255,0.06); position: relative; flex-shrink: 0; }
    .search-input { width: 100%; background: #07070b; border: 1px solid rgba(255,255,255,0.12); color: #fff; padding: 9px 10px 9px 34px; border-radius: 6px; font-family: 'Outfit', sans-serif; font-size: 12px; outline: none; }
    .search-input:focus { border-color: var(--wr-gold); }
    .search-icon { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 12px; }
    .tab-content { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .company-section-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800; color: var(--wr-gold); text-transform: uppercase; letter-spacing: 1px; padding: 4px 8px; border-left: 3px solid var(--wr-red); background: rgba(255,255,255,0.03); border-radius: 0 4px 4px 0; }
    .stadium-card { background: var(--wr-card); border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; padding: 12px; cursor: pointer; transition: all 0.2s; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; }
    .stadium-card:hover { border-color: var(--wr-gold); transform: translateX(3px); }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .card-league { color: var(--wr-gold); font-size: 10px; font-weight: 800; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }
    .card-live { font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }
    .card-title { font-size: 13px; font-weight: 700; color: #f1f5f9; line-height: 1.3; }
    .card-bottom { display: flex; justify-content: space-between; color: #94a3b8; font-size: 10px; font-weight: 600; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 6px; margin-top: 2px; font-family: 'JetBrains Mono', monospace; }
    #exit-cinema-btn { position: fixed; bottom: 24px; right: 24px; background: var(--wr-red); color: white; border: none; padding: 12px 20px; border-radius: 50px; font-size: 11px; font-weight: 800; cursor: pointer; z-index: 99999; display: none; box-shadow: 0 6px 20px rgba(0,0,0,0.7); text-transform: uppercase; }
    .um-toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 99998; display: flex; flex-direction: column; gap: 10px; max-width: 340px; }
    .um-toast { background: linear-gradient(135deg, #1d0c14 0%, #07070b 100%); border: 1px solid var(--toast-accent); border-left: 4px solid var(--toast-accent); border-radius: 8px; padding: 14px 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 10px; }
    .um-toast-header { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--toast-accent); }
    .um-toast-title { font-size: 14px; font-weight: 800; color: #fff; line-height: 1.3; }
    .um-toast-meta { font-size: 11px; color: #94a3b8; font-family: 'JetBrains Mono', monospace; }
    .um-toast-actions { display: flex; gap: 8px; margin-top: 4px; }
    .um-toast-btn { flex: 1; padding: 8px 10px; border-radius: 5px; font-size: 11px; font-weight: 800; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .um-toast-btn.watch { background: var(--toast-accent); color: #000; }
    .um-toast-btn.dismiss { background: transparent; color: #94a3b8; border: 1px solid rgba(255,255,255,0.2); flex: 0 0 auto; padding: 8px 12px; }
    @media(max-width: 900px) {
      body { overflow-y: auto; }
      .stadium-app { height: auto; min-height: 100vh; }
      header { flex-direction: column; height: auto; padding: 12px; }
      .stadium-main { grid-template-columns: 1fr; height: auto; overflow: visible; }
      .video-wrapper { aspect-ratio: 16/9; flex: none; }
      .stadium-sidebar { border-left: none; border-top: 2px solid var(--wr-red); height: auto; overflow: visible; }
      .tab-content { overflow-y: visible; height: auto; }
    }
  </style>
</head>
<body>
  <button id='exit-cinema-btn' type='button'><i class='fas fa-compress-alt'></i> SALIR MODO CINE</button>
  <div class='um-toast-container' id='um-toast-container'></div>

  <div class='stadium-app' id='stadium-app-wrapper'>
    <header>
      <div class='brand-box'>
        <h1>UNREALMAT <span>WRESTLING</span></h1>
        <a class='btn-return' href='/'><i class='fas fa-home'></i> WEB PRINCIPAL</a>
        <button class='btn-refresh' id='btn-refresh' type='button'><i class='fas fa-sync-alt'></i> ACTUALIZAR</button>
      </div>
      <div class='stadium-controls'>

        <button class='grid-btn' id='btn-g2' data-slots='2' type='button'><i class='fas fa-columns'></i> 2 TV</button>

    <main class='stadium-main' id='app-body-stadium'>
      <section class='stadium-player-zone'>

        <div id='alternative-servers-panel'>
          <div class='alt-servers-header'>
            <div class='alt-servers-title'><i class='fas fa-satellite-dish'></i> Canales del Show</div>
            <span class='mode-pill live' id='active-signal-mode'>LIVE</span>
          </div>
          <div class='alt-servers-list' id='alt-servers-list'></div>
        </div>
      </section>

      <aside class='stadium-sidebar' id='app-sidebar-stadium'>
        <div class='hero-match'>
          <div class='hero-label'><i class='fas fa-fist-raised'></i> AGENDA DIVIDIDA POR EMPRESA</div>
          <div class='hero-title' id='hero-company-title'>TODAS LAS EMPRESAS</div>
        </div>
        <nav class='company-tabs' id='company-tabs'>
          <button class='company-tab active' data-company='ALL' type='button'>TODAS</button>
          <button class='company-tab' data-company='WWE' type='button'>WWE</button>
          <button class='company-tab' data-company='AEW' type='button'>AEW</button>
          <button class='company-tab' data-company='TNA' type='button'>TNA</button>
          <button class='company-tab' data-company='NJPW' type='button'>NJPW</button>
          <button class='company-tab' data-company='OTRAS' type='button'>OTRAS</button>
        </nav>

          <button class='mode-filter-btn active' data-mode='ALL' type='button'>TODO</button>
          <button class='mode-filter-btn' data-mode='LIVE' type='button'>LIVE</button>
          <button class='mode-filter-btn' data-mode='REPLAY' type='button'>REPLAY</button>
          <button class='mode-filter-btn' data-mode='CAL' type='button'>CALENDARIO</button>
        </div>
        <div class='search-container'>
          <i class='fas fa-search search-icon'></i>
          <input class='search-input' id='search-input' placeholder='Buscar RAW, SmackDown, Dynamite, PLE...' type='text'/>
        </div>
        <div class='tab-content' id='panel-agenda-content'>
          <div id='stadium-feed-target'><div style='padding:20px; text-align:center; opacity:0.6;'><i class='fas fa-circle-notch fa-spin'></i> Cargando carteleras por empresa...</div></div>
        </div>
      </aside>
    </main>
  </div>

  <script>
    const EMPRESAS_ORDEN = ['WWE', 'AEW', 'TNA', 'NJPW', 'OTRAS'];
    let allWrestlingEvents = [];
    let externalCrossSportEvents = [];
    let currentCompany = 'ALL';
    let currentMode = 'ALL';
    let slotData = [];
    let activeSlotIndex = 0;
    let targetSlotIndex = 0;
    const notifiedEventKeys = new Set();
    const _notificationData = {};
    const API_KEY = "AIzaSyAX5ciAJoCdwnz4PGrvVXG2KlKJlrACVgM";
    const WRESTLING_CALENDARS = [
      { company: 'WWE',  id: 'a070eeba37995e97cff5a176f99d4ed9e90b671a0a9e9e22e5eb370312c54e62@group.calendar.google.com', timeOffset: 3600000 },
      { company: 'AEW',  id: '0827b95e8b37fd9559f457c39aa6733daaaa4ffe4833d2a27917ed65eb01d052@group.calendar.google.com', timeOffset: 3600000 },
      { company: 'TNA',  id: '727b20f12dcf43bd661017bafba52fd7a8ad706a2ebe48afa6a5f4b391b71490@group.calendar.google.com', timeOffset: 3600000 },
      { company: 'NJPW', id: 'n6l35ni6rcbffi1m4m5g5ocnh4@group.calendar.google.com', timeOffset: 3600000 }
    ];

    function recargarBlog(btn){ if(btn) btn.classList.add('spinning'); setTimeout(()=>location.reload(),500); }
    function escapeHTML(str){ if(str==null) return ''; return String(str).replace(/[&<>'"]/g, t=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t])); }
    function normalizar(t){ return (t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase(); }

    function detectarEmpresa(rawCompany, titulo){
      const c = normalizar(rawCompany);
      if(['WWE', 'AEW', 'TNA', 'NJPW'].includes(c)) return c;
      const t = `${c} ${normalizar(titulo)}`;
      if(/\b(WWE|RAW|SMACKDOWN|NXT|WRESTLEMANIA|ROYAL RUMBLE|SUMMERSLAM|MONEY IN THE BANK|SURVIVOR SERIES|PLE)\b/.test(t)) return 'WWE';
      if(/\b(AEW|DYNAMITE|RAMPAGE|COLLISION|DOUBLE OR NOTHING|ALL IN|ALL OUT|FORBIDDEN DOOR|REVOLUTION)\b/.test(t)) return 'AEW';
      if(/\b(TNA|IMPACT|BOUND FOR GLORY|SLAMMIVERSARY|HARD TO KILL)\b/.test(t)) return 'TNA';
      if(/\b(NJPW|NEW JAPAN|WRESTLE KINGDOM|DOMINION|G1 CLIMAX|BOSJ|SUPER JUNIOR)\b/.test(t)) return 'NJPW';
      return 'OTRAS';
    }

    function sanitizeStreamUrl(rawUrl){
      if(!rawUrl || typeof rawUrl !== 'string') return null;
      try {
        const parsed = new URL(rawUrl.trim());
        if(parsed.protocol === 'http:') parsed.protocol = 'https:';
        if(parsed.protocol !== 'https:') return null;
        return parsed.toString();
      } catch (e) {
        return null;
      }
    }

    function parseEventDate(e){
      if(e.fecha_completa){
        const d = new Date(e.fecha_completa);
        if(!isNaN(d.getTime())) return d;
        if(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(e.fecha_completa)){
          const d2 = new Date(e.fecha_completa.replace(" ","T")+":00-05:00");
          if(!isNaN(d2.getTime())) return d2;
        }
      }
      if(e.hora && e.hora !== "00:00"){
        const now = new Date();
        const utc = new Date(now.getTime()-(5*60*60*1000));
        const iso = `${utc.getUTCFullYear()}-${String(utc.getUTCMonth()+1).padStart(2,'0')}-${String(utc.getUTCDate()).padStart(2,'0')}T${e.hora}:00-05:00`;
        const d3 = new Date(iso);
        if(!isNaN(d3.getTime())) return d3;
      }
      return null;
    }

    function getSlotCount(){ return document.querySelectorAll('.stadium-monitor').length; }
    function findFirstEmptySlot(){ for(let i=0;i<getSlotCount();i++){ if(!slotData[i]||!slotData[i].url) return i; } return -1; }

    function createSlotElement(i){
      const div = document.createElement('div');
      div.className = 'stadium-monitor' + (i===0 ? ' focus-pitch' : '');
      div.id = 'stadium-slot-' + i;
      div.addEventListener('click', () => focusSlot(i));

      const tag = document.createElement('div');
      tag.className = 'monitor-tag';
      tag.innerHTML = `<i class="fas fa-play-circle"></i> RING 0${i+1}`;
      tag.addEventListener('click', (ev) => { ev.stopPropagation(); focusSlot(i); });

      const core = document.createElement('div');
      core.id = 'stadium-core-' + i;
      core.className = 'stadium-core';
      core.innerHTML = '<i class="fas fa-tv" style="font-size:40px; margin-bottom:10px;"></i><span style="font-size:12px; font-weight:600; text-align:center; padding:0 10px;">Selecciona un show o replay</span>';

      const muteBadge = document.createElement('div');
      muteBadge.className = 'mute-badge';
      muteBadge.id = 'mute-badge-' + i;
      muteBadge.innerHTML = '<i class="fas fa-volume-mute"></i> Activar audio';
      muteBadge.addEventListener('click', (ev) => { ev.stopPropagation(); focusSlot(i); });

      div.append(tag, core, muteBadge);
      return div;
    }

    function buildStadiumGrid(slots, button){
      const mesh = document.getElementById('stadium-grid-mesh');
      document.querySelectorAll('.stadium-controls .grid-btn').forEach(b=>{ if(!b.classList.contains('cinema-btn')) b.classList.remove('active-grid'); });
      if(button) button.classList.add('active-grid');
      if(slots===1){ mesh.style.gridTemplateColumns='1fr'; mesh.style.gridTemplateRows='1fr'; }
      if(slots===2){ mesh.style.gridTemplateColumns='1fr 1fr'; mesh.style.gridTemplateRows='1fr'; }
      if(slots===3){ mesh.style.gridTemplateColumns='1fr 1fr 1fr'; mesh.style.gridTemplateRows='1fr'; }
      if(slots===4){ mesh.style.gridTemplateColumns='1fr 1fr'; mesh.style.gridTemplateRows='1fr 1fr'; }
      const current = mesh.children.length;
      if(slots>current){ for(let i=current;i<slots;i++) mesh.appendChild(createSlotElement(i)); }
      else if(slots<current){ for(let i=current-1;i>=slots;i--){ mesh.removeChild(mesh.children[i]); slotData[i]=null; } if(activeSlotIndex>=slots) activeSlotIndex=0; if(targetSlotIndex>=slots) targetSlotIndex=0; }
      const empty = findFirstEmptySlot(); if(empty!==-1) targetSlotIndex=empty;
      applyMuteStates();
    }

    function focusSlot(i){
      if(i===activeSlotIndex) return;
      const prev = activeSlotIndex; activeSlotIndex=i; targetSlotIndex=i;
      muteIframeWithoutReload(prev);
      if(slotData[i] && slotData[i].url) renderStream(i, slotData[i].url, false);
      applyMuteStates();
    }

    function muteIframeWithoutReload(slotIdx){
      const core = document.getElementById('stadium-core-'+slotIdx); if(!core) return;
      const iframe = core.querySelector('iframe'); if(!iframe || !iframe.src) return;
      try{
        const targetOrigin = new URL(iframe.src).origin;
        iframe.contentWindow.postMessage({type:'mute',muted:true}, targetOrigin);
        iframe.contentWindow.postMessage('mute', targetOrigin);
      }catch(e){}
    }

    function applyMuteStates(){
      for(let i=0;i<getSlotCount();i++){
        const m = document.getElementById('stadium-slot-'+i); if(m) m.classList.toggle('focus-pitch', i===activeSlotIndex);
        const badge = document.getElementById('mute-badge-'+i); const has = slotData[i]&&slotData[i].url;
        if(badge) badge.classList.toggle('visible', !!has && i!==activeSlotIndex);
      }
    }

    function loadInTarget(url){
      const safeUrl = sanitizeStreamUrl(url);
      if(!safeUrl) return;
      const isMuted = (targetSlotIndex!==activeSlotIndex);
      slotData[targetSlotIndex] = {url: safeUrl};
      renderStream(targetSlotIndex, safeUrl, isMuted);
      applyMuteStates();
      const next = findFirstEmptySlot(); if(next!==-1) targetSlotIndex=next;
    }

    function openInMultiSlotFromNotification(url){
      const safeUrl = sanitizeStreamUrl(url);
      if(!safeUrl) return;
      const activeCount = slotData.filter(s => s && s.url).length;
      const desiredSlots = Math.min(4, Math.max(2, activeCount + 1));
      const targetBtn = document.getElementById('btn-g' + desiredSlots);
      buildStadiumGrid(desiredSlots, targetBtn);

      let free = findFirstEmptySlot();
      if(free === -1){
        free = desiredSlots - 1;
      }
      const hasPrimaryAudio = slotData.some((s, idx) => idx !== free && s && s.url);
      slotData[free] = { url: safeUrl };
      renderStream(free, safeUrl, hasPrimaryAudio);
      if(!hasPrimaryAudio){
        activeSlotIndex = free;
      }
      targetSlotIndex = findFirstEmptySlot() !== -1 ? findFirstEmptySlot() : free;
      applyMuteStates();
    }

    function renderStream(slotIdx, url, muted){
      const core = document.getElementById('stadium-core-'+slotIdx); if(!core) return;
      const safeUrl = sanitizeStreamUrl(url);
      if(!safeUrl){
        core.innerHTML='<div style="color:#ff3b30;padding:20px;text-align:center;"><i class="fas fa-shield-alt" style="font-size:30px;margin-bottom:10px;"></i><br>URL bloqueada por seguridad.</div>';
        return;
      }
      const parsed = new URL(safeUrl);
      if(muted) parsed.searchParams.set('mute', '1');
      core.innerHTML = '';
      const f = document.createElement('iframe');
      f.src = parsed.toString();
      f.style.cssText = 'width:100%;height:100%;border:none;';
      f.setAttribute('allowfullscreen','true');
      f.setAttribute('webkitallowfullscreen','true');
      f.setAttribute('mozallowfullscreen','true');
      f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture; user-activation';
      f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
      core.appendChild(f);
    }

    function normalizarServidores(lista){
      if(!Array.isArray(lista)) return [];
      return lista
        .map((s, i) => ({
          nombre: (s && (s.nombre || s.stream)) || `Canal ${i + 1}`,
          url: sanitizeStreamUrl(s && (s.url || s.stream_url || ''))
        }))
        .filter(s => !!s.url);
    }

    async function cargarWrestling(){
      const combined = [];
      try{
        const res = await fetch(`../output/agenda_wrestling.json?v=${Date.now()}`);
        if(res.ok){
          const data = await res.json();
          const eventos = Array.isArray(data.eventos) ? data.eventos : (Array.isArray(data) ? data : []);
          eventos.forEach(ev => {
            const titulo = ev.titulo || ev.evento || 'Show de Wrestling';
            const empresa = detectarEmpresa(ev.promocion || ev.empresa || ev.torneo || '', titulo);
            const liveSrv = normalizarServidores(ev.servidores_live || ev.live || []);
            const replaySrv = normalizarServidores(ev.servidores_replay || ev.replay || []);
            const fallbackSrv = (liveSrv.length === 0 && replaySrv.length === 0) ? normalizarServidores(ev.servidores || []) : [];
            combined.push({
              titulo,
              empresa,
              etiquetaEmpresa: ev.promocion || ev.empresa || empresa,
              eventDateObj: parseEventDate(ev),
              servidoresLive: liveSrv.length > 0 ? liveSrv : fallbackSrv,
              servidoresReplay: replaySrv
            });
          });
        }
      }catch(e){}

      const tMin = new Date(Date.now() - 48 * 60 * 60 * 1000).toISOString();
      await Promise.all(WRESTLING_CALENDARS.map(async cal => {
        try{
          const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events?key=${encodeURIComponent(API_KEY)}&timeMin=${encodeURIComponent(tMin)}&maxResults=15&singleEvents=true&orderBy=startTime`;
          const cRes = await fetch(url);
          if(!cRes.ok) return;
          const cData = await cRes.json();
          (cData.items || []).forEach(item => {
            const raw = item.start.dateTime || (item.start.date + 'T00:00:00');
            const ts = new Date(raw).getTime() + (cal.timeOffset || 0);
            const titulo = item.summary || `Evento ${cal.company}`;
            const yaExiste = combined.some(existing =>
              existing.empresa === cal.company &&
              normalizar(existing.titulo).replace(/[^A-Z0-9]/g,'') === normalizar(titulo).replace(/[^A-Z0-9]/g,'')
            );
            if(!yaExiste){
              combined.push({
                titulo,
                empresa: cal.company,
                etiquetaEmpresa: cal.company,
                eventDateObj: new Date(ts),
                servidoresLive: [],
                servidoresReplay: []
              });
            }
          });
        }catch(e){}
      }));

      combined.sort((a,b) => {
        if(!a.eventDateObj) return 1;
        if(!b.eventDateObj) return -1;
        return b.eventDateObj.getTime() - a.eventDateObj.getTime();
      });

      allWrestlingEvents = combined;
      aplicarFiltros();
      cargarEventosOtrosDeportes();
    }

    async function cargarEventosOtrosDeportes(){
      const fuentes = [
        { deporte: 'FUTBOL', url: `../output/agenda_futbol.json?v=${Date.now()}` },
        { deporte: 'NBA',    url: `../output/agenda_nba.json?v=${Date.now()}` },
        { deporte: 'F1',     url: `../output/agenda_f1.json?v=${Date.now()}` }
      ];
      const lista = [];
      await Promise.all(fuentes.map(async f => {
        try{
          const r = await fetch(f.url);
          if(!r.ok) return;
          const d = await r.json();
          (d.eventos || []).forEach(ev => {
            const srvs = normalizarServidores(ev.servidores || []);
            if(srvs.length > 0){
              lista.push({
                deporte: f.deporte,
                titulo: ev.titulo || 'Evento',
                torneo: ev.torneo || f.deporte,
                eventDateObj: parseEventDate(ev),
                url: srvs[0].url
              });
            }
          });
        }catch(e){}
      }));
      externalCrossSportEvents = lista;
      checkUpcomingEvents();
    }

    function checkUpcomingEvents(){
      const now = Date.now();
      const WINDOW_START = -3 * 60 * 1000;
      const WINDOW_END = 10 * 60 * 1000;
      for(const ev of externalCrossSportEvents){
        if(!ev.eventDateObj || !ev.url) continue;
        const t = ev.eventDateObj.getTime();
        if(t < now + WINDOW_START || t > now + WINDOW_END) continue;
        if(slotData.some(s => s && s.url === ev.url)) continue;
        const key = `${ev.deporte}|${normalizar(ev.titulo)}|${t}`;
        if(notifiedEventKeys.has(key)) continue;
        notifiedEventKeys.add(key);
        showNotification(ev);
      }
    }

    function showNotification(ev){
      const container = document.getElementById('um-toast-container');
      if(!container) return;
      const startsIn = ev.eventDateObj.getTime() - Date.now();
      const timeLabel = startsIn <= 0 ? 'EN VIVO ahora' : `Comienza en ${Math.max(1, Math.ceil(startsIn/60000))} min`;
      const id = 'toast-' + Date.now() + '-' + Math.random().toString(36).slice(2,7);
      _notificationData[id] = { url: ev.url };

      const toast = document.createElement('div');
      toast.className = 'um-toast';
      toast.id = id;
      toast.innerHTML = `
        <div class="um-toast-header"><i class="fas fa-bell"></i><span>${escapeHTML(ev.deporte)} · ${escapeHTML(ev.torneo)}</span></div>
        <div class="um-toast-title">${escapeHTML(ev.titulo)}</div>
        <div class="um-toast-meta">${escapeHTML(timeLabel)}</div>
        <div class="um-toast-actions"></div>`;

      const actions = toast.querySelector('.um-toast-actions');
      const watchBtn = document.createElement('button');
      watchBtn.type = 'button';
      watchBtn.className = 'um-toast-btn watch';
      watchBtn.innerHTML = '<i class="fas fa-th-large"></i> Abrir multipantalla';
      watchBtn.addEventListener('click', () => {
        const item = _notificationData[id];
        if(item && item.url) openInMultiSlotFromNotification(item.url);
        delete _notificationData[id];
        toast.remove();
      });

      const dismissBtn = document.createElement('button');
      dismissBtn.type = 'button';
      dismissBtn.className = 'um-toast-btn dismiss';
      dismissBtn.innerHTML = '<i class="fas fa-times"></i>';
      dismissBtn.addEventListener('click', () => { delete _notificationData[id]; toast.remove(); });

      actions.append(watchBtn, dismissBtn);
      container.appendChild(toast);
      setTimeout(() => { delete _notificationData[id]; toast.remove(); }, 25000);
    }

    function cumpleFiltroModo(ev){
      const hasLive = ev.servidoresLive && ev.servidoresLive.length > 0;
      const hasReplay = ev.servidoresReplay && ev.servidoresReplay.length > 0;
      if(currentMode === 'LIVE') return hasLive;
      if(currentMode === 'REPLAY') return hasReplay;
      if(currentMode === 'CAL') return !hasLive && !hasReplay;
      return true;
    }

    function cumpleBusqueda(ev, q){
      if(!q) return true;
      return normalizar(ev.titulo).includes(q) || normalizar(ev.empresa).includes(q) || normalizar(ev.etiquetaEmpresa).includes(q);
    }

    function crearTarjetaEvento(ev){
      const globalIdx = allWrestlingEvents.indexOf(ev);
      const hasLive = ev.servidoresLive && ev.servidoresLive.length > 0;
      const hasReplay = ev.servidoresReplay && ev.servidoresReplay.length > 0;
      let estadoLabel = 'CALENDARIO';
      let estadoStyle = 'background:rgba(148,163,184,0.16);color:#cbd5e1;border:1px solid rgba(148,163,184,0.35);';
      if(hasLive){
        estadoLabel = 'LIVE';
        estadoStyle = 'background:rgba(225,29,72,0.22);color:#fb7185;border:1px solid #e11d48;';
      } else if(hasReplay){
        estadoLabel = 'REPLAY';
        estadoStyle = 'background:rgba(251,191,36,0.18);color:#fbbf24;border:1px solid #fbbf24;';
      }

      const fechaTexto = ev.eventDateObj
        ? `${ev.eventDateObj.toLocaleDateString([], {day:'2-digit',month:'2-digit'})} · ${ev.eventDateObj.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`
        : 'Horario por confirmar';

      const canalesCount = (ev.servidoresLive?.length || 0) + (ev.servidoresReplay?.length || 0);

      const card = document.createElement('div');
      card.className = 'stadium-card';
      card.innerHTML = `
        <div class="card-top">
          <span class="card-league">${escapeHTML(ev.empresa)}</span>
          <span class="card-live" style="${estadoStyle}">${escapeHTML(estadoLabel)}</span>
        </div>
        <div class="card-title">${escapeHTML(ev.titulo)}</div>
        <div class="card-bottom">
          <span><i class="fas fa-clock"></i> ${escapeHTML(fechaTexto)}</span>
          <span><i class="fas fa-satellite-dish"></i> ${canalesCount > 0 ? canalesCount + ' Canales' : 'Agenda'}</span>
        </div>`;
      card.addEventListener('click', () => seleccionarShow(globalIdx));
      return card;
    }

    function aplicarFiltros(){
      const q = normalizar(document.getElementById('search-input').value);
      const heroTitle = document.getElementById('hero-company-title');
      if(heroTitle){
        heroTitle.textContent = currentCompany === 'ALL' ? 'TODAS LAS EMPRESAS' : `CARTELERA · ${currentCompany}`;
      }

      const box = document.getElementById('stadium-feed-target');
      box.innerHTML = '';

      const filtrados = allWrestlingEvents.filter(ev =>
        (currentCompany === 'ALL' || ev.empresa === currentCompany) &&
        cumpleFiltroModo(ev) &&
        cumpleBusqueda(ev, q)
      );

      if(filtrados.length === 0){
        box.innerHTML = '<div style="padding:20px;opacity:.6;text-align:center;"><i class="fas fa-calendar-times" style="font-size:24px;margin-bottom:10px;"></i><br>No hay shows para esta empresa o filtro.</div>';
        return;
      }

      if(currentCompany === 'ALL'){
        EMPRESAS_ORDEN.forEach(emp => {
          const grupo = filtrados.filter(e => e.empresa === emp);
          if(grupo.length === 0) return;
          const secTitle = document.createElement('div');
          secTitle.className = 'company-section-title';
          secTitle.textContent = `${emp} (${grupo.length})`;
          box.appendChild(secTitle);
          grupo.forEach(ev => box.appendChild(crearTarjetaEvento(ev)));
        });
      } else {
        filtrados.forEach(ev => box.appendChild(crearTarjetaEvento(ev)));
      }
    }

    function seleccionarShow(index){
      const ev = allWrestlingEvents[index];
      if(!ev) return;
      const panel = document.getElementById('alternative-servers-panel');
      const list = document.getElementById('alt-servers-list');
      const pill = document.getElementById('active-signal-mode');
      list.innerHTML = '';

      const liveList = ev.servidoresLive || [];
      const replayList = ev.servidoresReplay || [];

      if(liveList.length === 0 && replayList.length === 0){
        panel.style.display = 'none';
        const core = document.getElementById('stadium-core-' + targetSlotIndex);
        if(core){
          core.innerHTML = `<div style="color:#fff;padding:20px;text-align:center;"><i class="fas fa-calendar-alt" style="font-size:36px;color:var(--wr-gold);margin-bottom:12px;"></i><h3 style="margin-bottom:8px;">${escapeHTML(ev.empresa)} · ${escapeHTML(ev.titulo)}</h3><p style="font-size:12px;color:#94a3b8;max-width:320px;">Show programado en agenda. Los enlaces LIVE o REPLAY aparecerán cuando estén disponibles.</p></div>`;
        }
        return;
      }

      liveList.forEach((s, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'alt-btn';
        btn.innerHTML = `<i class="fas fa-broadcast-tower"></i> LIVE · ${escapeHTML(s.nombre || ('Opción ' + (i + 1)))}`;
        btn.addEventListener('click', () => {
          pill.textContent = 'LIVE';
          pill.className = 'mode-pill live';
          loadInTarget(s.url);
        });
        list.appendChild(btn);
      });

      replayList.forEach((s, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'alt-btn replay-btn';
        btn.innerHTML = `<i class="fas fa-history"></i> REPLAY · ${escapeHTML(s.nombre || ('Opción ' + (i + 1)))}`;
        btn.addEventListener('click', () => {
          pill.textContent = 'REPLAY';
          pill.className = 'mode-pill replay';
          loadInTarget(s.url);
        });
        list.appendChild(btn);
      });

      panel.style.display = 'block';
      if(liveList.length > 0){
        pill.textContent = 'LIVE';
        pill.className = 'mode-pill live';
        loadInTarget(liveList[0].url);
      } else {
        pill.textContent = 'REPLAY';
        pill.className = 'mode-pill replay';
        loadInTarget(replayList[0].url);
      }
      if(window.innerWidth <= 900) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function enableCinemaMode(){
      document.querySelector('header').style.display='none';
      document.getElementById('app-sidebar-stadium').style.display='none';
      document.getElementById('alternative-servers-panel').style.display='none';
      const m = document.getElementById('app-body-stadium');
      m.style.gridTemplateColumns='1fr'; m.style.height='100vh';
      document.getElementById('exit-cinema-btn').style.display='block';
    }

    function disableCinemaMode(){
      document.querySelector('header').style.display='flex';
      document.getElementById('app-sidebar-stadium').style.display='flex';
      const m = document.getElementById('app-body-stadium');
      m.style.gridTemplateColumns = window.innerWidth<=900 ? '1fr' : '1fr 440px';
      m.style.height = window.innerWidth<=900 ? 'auto' : 'calc(100vh - 70px)';
      document.getElementById('exit-cinema-btn').style.display='none';
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btn-refresh')?.addEventListener('click', function(){ recargarBlog(this); });
      document.getElementById('btn-cinema')?.addEventListener('click', enableCinemaMode);
      document.getElementById('exit-cinema-btn')?.addEventListener('click', disableCinemaMode);
      document.getElementById('search-input')?.addEventListener('keyup', aplicarFiltros);
      document.querySelectorAll('.stadium-controls .grid-btn[data-slots]').forEach(btn => {
        btn.addEventListener('click', () => buildStadiumGrid(Number(btn.dataset.slots), btn));
      });
      document.querySelectorAll('.company-tabs .company-tab[data-company]').forEach(tab => {
        tab.addEventListener('click', function(){
          document.querySelectorAll('.company-tabs .company-tab').forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          currentCompany = this.dataset.company;
          aplicarFiltros();
        });
      });
      document.querySelectorAll('.mode-subbar .mode-filter-btn[data-mode]').forEach(btn => {
        btn.addEventListener('click', function(){
          document.querySelectorAll('.mode-subbar .mode-filter-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentMode = this.dataset.mode;
          aplicarFiltros();
        });
      });

      buildStadiumGrid(1, document.getElementById('btn-g1'));
      cargarWrestling();
      setInterval(checkUpcomingEvents, 60000);
    });
  </script>
</body>
</html>
