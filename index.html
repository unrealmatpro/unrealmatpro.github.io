<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset='UTF-8'/>
  <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no' name='viewport'/>
  <meta content='#020d08' name='theme-color'/>
  <title>UNREALMAT PRO+ | Central de Deportes</title>
  
  <meta content='Agenda deportiva en vivo: FIFA 2026, Fútbol, NBA, F1 y Wrestling. Sigue los eventos de UNREALMAT PRO+ en tiempo real.' name='description'/>
  <link href='https://fonts.googleapis.com' rel='preconnect'/>
  <link crossorigin='' href='https://fonts.gstatic.com' rel='preconnect'/>
  <link href='https://www.googleapis.com' rel='preconnect'/>
  <link href='https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap' rel='stylesheet'/>
  <link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' rel='stylesheet'/>

  <style>
    :root { --bg: #020d08; --surface: #041a10; --surface-card: #052c1a; --accent: #00ff88; --gold: #f4d03f; --border: rgba(255,255,255,0.08); --text-main: #fff; --text-dim: #aed1c4; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: radial-gradient(circle at center, var(--surface) 0%, var(--bg) 100%); color: var(--text-main); font-family: 'Outfit', sans-serif; overflow-x: hidden; min-height: 100vh; padding-bottom: 50px; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
    
    .site-header { background: rgba(2,13,8,0.95); border-bottom: 1px solid var(--border); padding: 15px 4%; text-align: center; position: sticky; top: 0; z-index: 999; backdrop-filter: blur(10px); }
    .site-title { font-size: 22px; font-weight: 900; letter-spacing: 3px; color: #fff; text-shadow: 0 0 15px rgba(0,255,136,0.3); }
    
    .hero-header-v2 { position: relative; margin: 20px 4% 0 4%; border-radius: 16px; overflow: hidden; border: 1px solid rgba(0, 255, 136, 0.2); background: linear-gradient(135deg, rgba(5,44,26,1) 0%, rgba(2,13,8,1) 100%); box-shadow: 0 0 30px rgba(0,255,136,0.1); padding: 40px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 180px; z-index: 1; }
    .hero-badge { background: rgba(0, 255, 136, 0.15); border: 1px solid var(--accent); color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 800; padding: 4px 12px; border-radius: 20px; letter-spacing: 2px; margin-bottom: 15px; display: inline-flex; align-items: center; gap: 8px; text-transform: uppercase; }
    .hero-title { font-size: clamp(24px, 4vw, 36px); font-weight: 900; text-transform: uppercase; letter-spacing: 1px; line-height: 1.1; margin-bottom: 10px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
    .hero-title span { color: var(--accent); }
    .hero-subtitle { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; }
    
    .grid-v4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 30px 4%; }
    .card-v4 { background: var(--surface-card); border-radius: 12px; border: 1px solid var(--border); text-decoration: none; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); overflow: hidden; display: block; position: relative; }
    .card-media-v4 { aspect-ratio: 16 / 9; overflow: hidden; background: #000; position: relative; }
    .card-media-v4 img { width: 100%; height: 100%; object-fit: cover; opacity: 0.35; filter: grayscale(80%); transition: transform 0.6s ease, filter 0.4s ease, opacity 0.4s ease; }
    .card-info-v4 { padding: 18px; border-top: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(2,13,8,0.5); }
    .card-info-v4 h3 { font-size: 11px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; transition: color 0.3s ease; }
    .card-next { display: block; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--accent); margin-top: 6px; letter-spacing: 0.5px; text-align: center; line-height: 1.3; opacity: 0.85; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-v4:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,255,136,0.1); }
    .card-v4:hover img { opacity: 0.9; filter: grayscale(0%); transform: scale(1.04); }
    .card-v4:hover h3 { color: #fff; }
    
    .um-ticker-wrap { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 1000; background: #000; border-top: 2px solid var(--accent); height: 40px; display: flex; align-items: center; box-shadow: 0 -5px 25px rgba(0,0,0,0.8); }
    #ticker-updated { position: absolute; right: 8px; top: -20px; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #6b8a7d; background: rgba(0,0,0,0.85); padding: 2px 8px; border-radius: 4px 4px 0 0; letter-spacing: 0.5px; }
    .ticker-label { background: var(--accent); color: #000; font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 900; padding: 0 15px; height: 100%; display: flex; align-items: center; z-index: 10; letter-spacing: 1px; }
    .ticker-viewport { flex: 1; overflow: hidden; position: relative; height: 100%; }
    .ticker-pause { background: transparent; border: none; border-left: 1px solid var(--border); color: var(--accent); font-size: 13px; padding: 0 12px; cursor: pointer; height: 100%; transition: background 0.2s; }
    .ticker-pause:hover { background: rgba(0,255,136,0.1); }
    .ticker-canvas { display: flex; align-items: center; height: 100%; white-space: nowrap; animation: ticker-run 40s linear infinite; }
    .ticker-canvas:hover, .ticker-canvas:focus-within, .ticker-canvas.paused { animation-play-state: paused; }
    .t-event { display: flex; align-items: center; gap: 10px; margin-right: 60px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.5px; }
    .t-badge { background: rgba(0,255,136,0.1); border: 1px solid var(--accent); padding: 2px 6px; border-radius: 4px; font-size: 8px; font-weight: 800; color: var(--accent); }
    .t-date { color: var(--gold); font-weight: 700; font-size: 10px; }
    .t-live-dot { width: 6px; height: 6px; background: #ff004c; border-radius: 50%; box-shadow: 0 0 8px #ff004c; animation: pulse 1s infinite; }
    @keyframes ticker-run { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    
    @media (max-width: 900px) { .grid-v4 { grid-template-columns: repeat(2, 1fr); padding: 20px 4%; gap: 15px; } }
    @media (max-width: 550px) { .site-title { font-size: 18px; } .grid-v4 { grid-template-columns: 1fr; } .ticker-label { padding: 0 8px; font-size: 8px; } .hero-header-v2 { padding: 30px 15px; min-height: 150px; } }
  </style>
</head>
<body>
  <header class='site-header'>
    <div class='site-title'>UNREALMAT PRO+</div>
  </header>

  <section class='hero-header-v2'>
    <div class='hero-badge'>En Vivo y En Directo</div>
    <h1 class='hero-title'>Central de <span>Deportes</span></h1>
    <p class='hero-subtitle'>FIFA 2026 &#183; NBA &#183; F1 &#183; WRESTLING</p>
  </section>

  <main class='grid-v4' id='grid'>
    <a class='card-v4' href='/futbol/'>
      <div class='card-media-v4'><img alt='Fútbol Mundial' src='https://external-preview.redd.it/cristiano-ronaldo-im-the-most-complete-footballer-ever-i-v0-AQQhDce_VkxjDq7BO21dIMqsoD4YuHdqn6U13UWzhtI.jpg?auto=webp&s=1dd86ddee6d2b2f6979509cc28418655dce2e88d'/></div>
      <div class='card-info-v4'><h3>FÚTBOL</h3><small class='card-next' data-tag='FUTBOL_BLOG'>Cargando&#8230;</small></div>
    </a>
    <a class='card-v4' href='/nba/'>
      <div class='card-media-v4'><img alt='NBA Basketball' src='https://elgurudelbasket.com/wp-content/uploads/2019/09/top100_feature.jpg'/></div>
      <div class='card-info-v4'><h3>NBA</h3><small class='card-next' data-tag='NBA'>Cargando&#8230;</small></div>
    </a>
    <a class='card-v4' href='/F1/'>
      <div class='card-media-v4'><img alt='Formula 1' src='https://a.espncdn.com/photo/2020/0629/r713850_1296x729_16-9.jpg'/></div>
      <div class='card-info-v4'><h3>Formula 1</h3><small class='card-next' data-tag='F1'>Cargando&#8230;</small></div>
    </a>
    <a class='card-v4' href='/wrestling/'>
      <div class='card-media-v4'><img alt='Wrestling News' src='https://i.ytimg.com/vi/C4NFvTvi1MY/hq720.jpg'/></div>
      <div class='card-info-v4'><h3>WRESTLING</h3><small class='card-next' data-tag='WWE,AEW,TNA,NJPW'>Cargando&#8230;</small></div>
    </a>
  </main>

  <footer class='um-ticker-wrap'>
    <small id='ticker-updated'>Actualizado &#8212;:&#8212;</small>
    <div class='ticker-label'>PRÓXIMO:</div>
    <div class='ticker-viewport'><div class='ticker-canvas' id='ticker-mount'><div class='t-event'>📡 SINCRONIZANDO CRONOGRAMA...</div></div></div>
    <button class='ticker-pause' id='ticker-pause' type='button'>&#9208;</button>
  </footer>

  <script>
    const APP_CONFIG = {
      apiKey: 'AIzaSyAX5ciAJoCdwnz4PGrvVXG2KlKJlrACVgM',
      calendars: [
        { label: 'WWE',  id: '392ef3c1b22a1e75198fdab2ad79f726bd6bf6452a001d076c152065a084ac5e@group.calendar.google.com' },
        { label: 'AEW',  id: '0827b95e8b37fd9559f457c39aa6733daaaa4ffe4833d2a27917ed65eb01d052@group.calendar.google.com' },
        { label: 'TNA',  id: '727b20f12dcf43bd661017bafba52fd7a8ad706a2ebe48afa6a5f4b391b71490@group.calendar.google.com' },
        { label: 'NJPW', id: 'n6l35ni6rcbffi1m4m5g5ocnh4@group.calendar.google.com' },
        { label: 'F1',   id: 'i3vhcidiluqakvb92ue0hl3nmg@group.calendar.google.com' }
      ]
    };
    const CACHE_KEY = 'um_events_v12'; 
    const CACHE_TTL = 10 * 60 * 1000; 
    const HORAS_LIMITE_MS = 2.5 * 60 * 60 * 1000;
    let cachedPool = [];
    let cachedF1Event = null;

    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
    function fmtDate(ts) { return new Date(ts).toLocaleDateString('es-UY', { day: '2-digit', month: 'short' }); }
    function fmtTime(ts) { return new Date(ts).toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' }); }
    function parseEventDate(e) {
        if (e.fecha_completa) { let d = new Date(e.fecha_completa); if (!isNaN(d.getTime())) return d; if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(e.fecha_completa)) { let d2 = new Date(e.fecha_completa.replace(" ", "T") + ":00-05:00"); if (!isNaN(d2.getTime())) return d2; } }
        if (e.hora && e.hora !== "00:00") { const now = new Date(); const utcDate = new Date(now.getTime() - (5 * 60 * 60 * 1000)); const isoStr = `${utcDate.getUTCFullYear()}-${String(utcDate.getUTCMonth()+1).padStart(2,'0')}-${String(utcDate.getUTCDate()).padStart(2,'0')}T${e.hora}:00-05:00`; let d3 = new Date(isoStr); if (!isNaN(d3.getTime())) return d3; }
        return null;
    }
    async function fetchAllEvents() {
      const timeMin = new Date(Date.now() - HORAS_LIMITE_MS).toISOString(); 
      const pool = [];
      const nowTs = Date.now();
      const jsonSources = [
        { url: './output/agenda_futbol.json', tag: 'FUTBOL_BLOG' },
        { url: './output/agenda_nba.json', tag: 'NBA' },
        { url: './output/agenda_f1.json', tag: 'F1' }
      ];
      await Promise.all(jsonSources.map(async src => {
          try {
            const res = await fetch(`${src.url}?v=${Date.now()}`);
            if (res.ok) { const data = await res.json(); (data.eventos || []).forEach(e => { const dateObj = parseEventDate(e); if (dateObj && dateObj.getTime() >= nowTs - HORAS_LIMITE_MS) { pool.push({ name: e.titulo || 'Evento', tag: src.tag, torneo: e.torneo || src.tag, time: dateObj.getTime() }); } }); }
          } catch (err) {}
      }));
      await Promise.all(APP_CONFIG.calendars.map(cal =>
          fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events?key=${APP_CONFIG.apiKey}&timeMin=${timeMin}&maxResults=5&singleEvents=true&orderBy=startTime`)
            .then(r => r.ok ? r.json() : null)
            .then(data => {
              if (data && data.items) { data.items.forEach(ev => { const raw = ev.start.dateTime || (ev.start.date + 'T00:00:00'); const evTs = new Date(raw).getTime(); if (cal.label === 'F1' && !cachedF1Event && evTs >= nowTs) { cachedF1Event = { name: ev.summary || 'Sesión F1', time: evTs }; } if (evTs >= nowTs - HORAS_LIMITE_MS) { pool.push({ name: ev.summary || 'Sin título', tag: cal.label, torneo: cal.label, time: evTs }); } }); }
            }).catch(() => null)
      ));
      return pool.sort((a, b) => a.time - b.time);
    }
    function renderTicker(pool) {
      const mount = document.getElementById('ticker-mount');
      if (!mount) return;
      if (pool.length === 0) { mount.innerHTML = '<div class="t-event">● NO HAY EVENTOS PRÓXIMOS EN AGENDA</div>'; return; }
      const content = pool.slice(0, 15).map(e => `<div class="t-event"><div class="t-live-dot"></div><span class="t-badge">${escapeHtml(e.torneo)}</span><span>${escapeHtml(e.name).toUpperCase()}</span><span class="t-date">[${fmtDate(e.time)} - ${fmtTime(e.time)}]</span></div>`).join('');
      mount.innerHTML = content + content;
      mount.style.animationDuration = `${Math.max(pool.slice(0, 15).length * 3, 15)}s`;
    }
    function updateCards(pool) {
      document.querySelectorAll('.card-next').forEach(el => {
        const tags = (el.dataset.tag || '').split(',').map(t => t.trim());
        if (tags.includes('F1') && cachedF1Event) { const shortName = cachedF1Event.name.length > 28 ? cachedF1Event.name.substring(0, 28) + '…' : cachedF1Event.name; el.textContent = `${shortName} · ${fmtDate(cachedF1Event.time)} ${fmtTime(cachedF1Event.time)}`; return; }
        const ev = pool.find(e => tags.includes(e.tag));
        if (ev) { const shortName = ev.name.length > 28 ? ev.name.substring(0, 28) + '…' : ev.name; el.textContent = `${shortName} · ${fmtDate(ev.time)} ${fmtTime(ev.time)}`; } else { el.textContent = 'Sin eventos próximos'; }
      });
    }
    function updateLastUpdated() { const el = document.getElementById('ticker-updated'); if (el) el.textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' }); }
    function refreshDisplay() { const nowTs = Date.now(); const activePool = cachedPool.filter(e => e.time >= nowTs - HORAS_LIMITE_MS); if (cachedF1Event && cachedF1Event.time < nowTs - HORAS_LIMITE_MS) cachedF1Event = null; renderTicker(activePool); updateCards(activePool); }
    async function syncEvents() {
      let pool = null;
      try { const raw = localStorage.getItem(CACHE_KEY); if (raw) { const cached = JSON.parse(raw); if (Date.now() - cached.ts < CACHE_TTL && Array.isArray(cached.data) && cached.f1Event) { pool = cached.data; cachedF1Event = cached.f1Event; } } } catch (e) { }
      if (!pool) { try { cachedF1Event = null; pool = await fetchAllEvents(); try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: pool, f1Event: cachedF1Event })); } catch (e) { } } catch (e) { return; } }
      cachedPool = pool; refreshDisplay(); updateLastUpdated();
    }
    window.addEventListener('DOMContentLoaded', () => {
      syncEvents(); setInterval(syncEvents, 300000); setInterval(refreshDisplay, 60000);
      const pauseBtn = document.getElementById('ticker-pause');
      if (pauseBtn) { pauseBtn.addEventListener('click', () => { const canvas = document.getElementById('ticker-mount'); const paused = canvas.classList.toggle('paused'); pauseBtn.textContent = paused ? '▶' : '⏸'; }); }
    });
  </script>
</body>
</html>
