name: Scrape streamxhd

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-streamxhd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Preparar directorio output
        run: mkdir -p output

      - name: Run scraper de deportes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: python extractor_local.py

      - name: Run scraper de wrestling
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: python extractor_wrestling.py

      - name: Validar JSONs generados en output/
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          archivos = [
              "output/agenda_futbol.json",
              "output/agenda_nba.json",
              "output/agenda_f1.json",
              "output/agenda_wrestling.json",
          ]
          for ruta_str in archivos:
              ruta = Path(ruta_str)
              if ruta.exists():
                  data = json.loads(ruta.read_text(encoding="utf-8"))
                  total = len(data.get("eventos", data if isinstance(data, list) else []))
                  print(f"[OK] {ruta_str}: {total} eventos")
              else:
                  print(f"[WARN] No encontrado: {ruta_str}")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventos-${{ github.run_id }}
          path: output/
          retention-days: 30

      - name: Commit and push output to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --staged --quiet; then
            echo "Sin cambios locales en output/, nada que commitear"
          else
            git commit -m "chore: eventos $(date -u +%Y-%m-%d-%H%M)"
          fi

          for intento in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              git merge -s ours origin/main -m "chore: sincronizar rama main" || true
            fi
            if git push origin HEAD:main; then
              echo "Push completado en intento ${intento}"
              exit 0
            fi
            echo "Reintentando push (intento ${intento})..."
            sleep 3
          done

          echo "Error: no se pudo hacer push a main tras 4 intentos"
          exit 1
